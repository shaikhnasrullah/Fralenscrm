<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FRALEN CRM — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1B2A6B; --accent: #4F6BF0; --accent-soft: #EEF1FE;
      --gray: #6B7280; --border: #C5D3E8;
    }
    body { font-family: 'Inter', sans-serif; background: #f0f4f8; min-height: 100vh; color: #111827; }
    .topbar {
      background: var(--navy); padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-logo { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 900; color: white; letter-spacing: 3px; }
    .topbar-logo span { color: #7B93FF; }
    .logout-btn {
      background: rgba(255,255,255,0.15); color: white; border: none;
      padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .welcome { padding: 20px 20px 4px; }
    .welcome .branch-name { font-size: 20px; font-weight: 800; color: var(--navy); }
    .welcome .sub { font-size: 12.5px; color: var(--gray); margin-top: 2px; }

    .grid {
      display: grid; grid-template-columns: 1fr; gap: 14px;
      padding: 20px; max-width: 600px; margin: 0 auto;
    }
    @media (min-width: 520px) { .grid { grid-template-columns: 1fr 1fr; } }

    .card {
      background: white; border: 1.5px solid var(--border); border-radius: 14px;
      padding: 20px; text-decoration: none; color: inherit; display: block;
      transition: border-color 0.15s, transform 0.1s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card .icon { font-size: 26px; margin-bottom: 10px; }
    .card .title { font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
    .card .desc { font-size: 12px; color: var(--gray); line-height: 1.5; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">FRAL<span>EN</span> CRM</div>
  <button class="logout-btn" onclick="window.doLogout()">Logout</button>
</div>

<div class="welcome">
  <div class="branch-name" id="branch-name">Loading...</div>
  <div class="sub" id="branch-email"></div>
</div>

<div class="grid">
  <a class="card" href="create-order.html">
    <div class="icon">🧾</div>
    <div class="title">Create New Order</div>
    <div class="desc">Customer order, products, prescription aur payment details.</div>
  </a>
  <a class="card" href="purchase.html">
    <div class="icon">📦</div>
    <div class="title">Purchase / Set through Supplier</div>
    <div class="desc">Add Purchase, Purchase History, Return/Defect, History of Returns.</div>
  </a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const fbApp = initializeApp({
    apiKey: "AIzaSyBHSFdvPAI1kz91whHbTj0rgUefVhPthLc",
    authDomain: "loginpage1-16430.firebaseapp.com",
    projectId: "loginpage1-16430",
    storageBucket: "loginpage1-16430.firebasestorage.app",
    messagingSenderId: "438297643443",
    appId: "1:438297643443:web:a2a75a2873d2746613e3c6"
  });
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "index.html"; return; }
    document.getElementById('branch-email').textContent = user.email || '';
    try {
      const branchDoc = await getDoc(doc(db, "branches", user.uid));
      document.getElementById('branch-name').textContent = branchDoc.exists() ? (branchDoc.data().branchName || 'My Branch') : 'My Branch';
    } catch (e) {
      document.getElementById('branch-name').textContent = 'My Branch';
    }
  });

  async function doLogout() {
    await signOut(auth);
    window.location.href = 'index.html';
  }

  window.doLogout = doLogout;
</script>

</body>
</html>
